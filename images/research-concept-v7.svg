<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Research concept visual</title>
  <desc id="desc">A clear concept diagram showing plant physiology at the center and four connected research areas: controlled environment, non-destructive sensing, root system and nitrogen, and postharvest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a2a"/>
      <stop offset="100%" stop-color="#10253e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="92%" r="36%">
      <stop offset="0%" stop-color="rgba(216,46,82,.38)"/>
      <stop offset="100%" stop-color="rgba(216,46,82,0)"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="56%">
      <stop offset="0%" stop-color="rgba(126,220,255,.16)"/>
      <stop offset="100%" stop-color="rgba(126,220,255,0)"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.05)"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#95d7aa"/>
      <stop offset="100%" stop-color="#4c9970"/>
    </linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff91ab"/>
      <stop offset="100%" stop-color="#d62e52"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06111d" flood-opacity="0.45"/>
    </filter>
    <style>
      .grid{stroke:rgba(255,255,255,.06);stroke-width:1}
      .panel{fill:url(#panel);stroke:rgba(255,255,255,.10);stroke-width:2}
      .panelTitle{fill:#f3f7fc;font:700 48px Inter,Arial,sans-serif}
      .panelSub{fill:#aab8c8;font:500 24px Inter,Arial,sans-serif}
      .mini{fill:#91a1b3;font:600 22px Inter,Arial,sans-serif}
      .centerTitle{fill:#f7fbff;font:800 56px Inter,Arial,sans-serif}
      .centerText{fill:#b9c7d6;font:500 26px Inter,Arial,sans-serif}
      .accent{stroke:#ff7e99;stroke-width:5;stroke-dasharray:12 10;fill:none;stroke-linecap:round}
      .label{fill:#ff8fa5;font:800 20px Inter,Arial,sans-serif;letter-spacing:.12em}
      .smallPanel{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.08);stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1080" rx="40" fill="url(#bg)"/>
  <rect width="1600" height="1080" rx="40" fill="url(#glow)"/>
  <g opacity="0.9">
    <path class="grid" d="M120 0V1080"/><path class="grid" d="M260 0V1080"/><path class="grid" d="M400 0V1080"/><path class="grid" d="M540 0V1080"/><path class="grid" d="M680 0V1080"/><path class="grid" d="M820 0V1080"/><path class="grid" d="M960 0V1080"/><path class="grid" d="M1100 0V1080"/><path class="grid" d="M1240 0V1080"/><path class="grid" d="M1380 0V1080"/>
    <path class="grid" d="M0 170H1600"/><path class="grid" d="M0 360H1600"/><path class="grid" d="M0 550H1600"/><path class="grid" d="M0 740H1600"/><path class="grid" d="M0 930H1600"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="95" y="170" width="420" height="220" rx="30" class="panel"/>
    <rect x="1085" y="170" width="420" height="220" rx="30" class="panel"/>
    <rect x="95" y="730" width="470" height="220" rx="30" class="panel"/>
    <rect x="1035" y="730" width="470" height="220" rx="30" class="panel"/>
  </g>

  <path class="accent" d="M515 280C630 310 662 352 730 430"/>
  <path class="accent" d="M1085 280C980 315 940 348 872 430"/>
  <path class="accent" d="M500 780C630 742 670 705 736 624"/>
  <path class="accent" d="M1045 780C948 740 915 705 870 624"/>

