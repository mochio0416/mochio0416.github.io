<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Research concept</title><desc id="d">Plant physiology connects four research areas: high-yield physiology, controlled environment, postharvest, and non-destructive sensing.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b2d"/><stop offset="1" stop-color="#11283f"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bd8ae"/><stop offset="1" stop-color="#55a079"/></linearGradient>
  <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff839c"/><stop offset="1" stop-color="#ce2f53"/></linearGradient>
  <style>
    .card{fill:#172a3e;stroke:#30465c;stroke-width:2}.title{fill:#f6f8fb;font:700 27px Arial,sans-serif}.sub{fill:#9fb0c1;font:500 16px Arial,sans-serif}.line{stroke:#ff8099;stroke-width:3;stroke-dasharray:8 8;fill:none;stroke-linecap:round}.icon{stroke:#87d6f4;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.pink{stroke:#ff8099}.green{stroke:#8fd0a3}.small{fill:#ff8da5;font:800 15px Arial,sans-serif;letter-spacing:.08em}
  </style>
</defs>
